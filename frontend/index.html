
<!DOCTYPE html>
<html lang="en">

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greener-Spot Opticals | See The World Clearly Again</title>
    <meta name="description" content="Greener-Sport Opticals provides professional eye examinations, prescription glasses, contact lenses and advanced eye care services.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </head>


<body>
    <section class="appointment section" id="appointment">
        <div class="container">
            <div class="appointment-wrapper">
                <div class="appointment-info">

                    <h2>
                        Book Your Eye Examination
                    </h2>
                    <p>
                        Schedule your appointment today and take 
                        the first step towards healthier vision.
                    </p>

                    </div>
                        <form id="appointmentForm">
                            <input type="text" name="fullName" placeholder="Full Name" required>
                            <input type="email" name="email" placeholder="Email Address" required>
                            <input type="tel" name="phoneNumber" placeholder="Phone Number" required>

                            <select name="serviceType" required>
                                <option value="" disabled selected>Select Service</option>
                                <option>Comprehensive Eye Examination</option>
                                <option>Prescription Glasses</option>
                                <option>Contact Lens Fitting</option>
                                <option> Glaucoma Screening</option>
                                <option>Dry Eye Management</option>
                            </select>
                            <input type="date" name="date" required>

                            <textarea name="additionalMessage" rows="4" placeholder="Additional Message"> </textarea>

                            <button type="submit" class="btn">
                                Request Appointment
                            </button>
                        </form>
                    </div>
                </div>
            </div> 
        </div>
    </section>

    <section class="contact section" id="contact">
    <div class="container contact-grid">
        <div class="contact-info">

                <span class="section-tag">
                    Contact Us
                </span>

                <h2>
                    Visit Our Practice 
                </h2>

                <p>
                    <i class="fa-solid fa-location-dot"></i>
                    Giyani, Section a, Limpopo, South Africa
                </p>

                <p>
                    <i class="fa-solid fa-phone"></i>
                    +27 66 232 7912
                </p>

                <p>
                    <i class="fa-solid fa-envelope"></i>
                    hello@greenerspotopticals.co.za
                </p>

                <p>
                    <i class="fa-solid fa-clock"></i>
                    Mon - Fri: 08:00 - 17:00 Sat: 08:00 - 14:00
                </p>
            </div>


            <div class="map">
            <iframe src="https://maps.google.com/maps?q=giyani&t=&z=13&ie=UTF8&iwloc=&output=embed">
                </iframe>
            </div>
        </div>

    </section>

     <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
     <script src="js/script.js"></script>
    <script src="SendEmail.js"></script>
</body>
</html>
